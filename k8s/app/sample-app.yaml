apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: demo-app
  labels: {app: sample-app}
spec:
  replicas: 2
  selector:
    matchLabels: {app: sample-app}
  template:
    metadata:
      labels: {app: sample-app}
    spec:
      containers:
        - name: sample-app
          image: sample-app:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: ERROR_RATE
              value: "0.05"
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: demo-app
spec:
  type: NodePort
  selector: {app: sample-app}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
# Generates steady traffic so dashboards and logs have data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadgen}
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      containers:
        - name: loadgen
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - while true; do
                wget -q -O /dev/null http://sample-app:8080/api/orders;
                wget -q -O /dev/null http://sample-app:8080/;
                sleep 0.5;
              done
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 50m, memory: 16Mi}
