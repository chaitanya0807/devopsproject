apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: monitoring
  labels: {app: cadvisor}
spec:
  selector:
    matchLabels: {app: cadvisor}
  template:
    metadata:
      labels: {app: cadvisor}
    spec:
      automountServiceAccountToken: false   # cAdvisor does not call the API
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.52.1
          args:
            - --housekeeping_interval=15s
            - --docker_only=false
            - --store_container_labels=false
            - --whitelisted_container_labels=io.kubernetes.container.name,io.kubernetes.pod.name,io.kubernetes.pod.namespace
            - --containerd=/run/containerd/containerd.sock
            - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,process
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 200Mi}
          volumeMounts:
            - {name: rootfs, mountPath: /rootfs, readOnly: true}
            - {name: containerd-run, mountPath: /run/containerd, readOnly: true}
            - {name: sys, mountPath: /sys, readOnly: true}
            - {name: containerd, mountPath: /var/lib/containerd, readOnly: true}
            - {name: disk, mountPath: /dev/disk, readOnly: true}
          securityContext:
            privileged: true
      volumes:
        - {name: rootfs, hostPath: {path: /}}
        - {name: containerd-run, hostPath: {path: /run/containerd}}
        - {name: sys, hostPath: {path: /sys}}
        - {name: containerd, hostPath: {path: /var/lib/containerd}}
        - {name: disk, hostPath: {path: /dev/disk}}
---
apiVersion: v1
kind: Service
metadata:
  name: cadvisor
  namespace: monitoring
spec:
  type: NodePort
  selector: {app: cadvisor}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30881
